name: Keep Alive

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  keepalive:
    name: Keep Alive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep Alive
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
